name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rust_uma_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test -d rust_uma_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUST_UMA_TEST_DATABASE_URL: postgres://test:test-only@127.0.0.1:5432/rust_uma_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo test --locked postgres_context_schema_contract -- --ignored
      - run: cargo clippy --locked --all-targets -- -D warnings
