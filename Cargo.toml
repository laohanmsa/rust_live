[package]
name = "polym-rust-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
polymarket_client_sdk_v2 = { version = "=0.8.0", features = ["clob"] }
alloy = { version = "1.6.3", default-features = false, features = ["signer-local", "sol-types"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }

rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
async-nats = "0.38"
redis = { version = "0.32", features = ["tokio-comp"] }
futures-util = "0.3"
rust_decimal = { version = "1", features = ["maths"] }

[profile.release]
lto = "thin"
codegen-units = 1
